<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مغامرة جزيرة الرقاقة — الإدارة الهندسية</title>
<style>:root{
  --bg:#1a1c2c; --purple:#5d275d; --red:#b13e53; --orange:#ef7d57; --yellow:#ffcd75; --lime:#a7f070;
  --green:#38b764; --teal:#257179; --navy:#29366f; --blue:#3b5dc9; --sky:#41a6f6; --cyan:#73eff7;
  --white:#f4f4f4; --silver:#94b0c2; --slate:#566c86; --dark:#333c57;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--white);
  font-family:Tahoma,"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;font-size:16px;line-height:1.7}
body{background-image:
  radial-gradient(var(--dark) 1px,transparent 1px),radial-gradient(var(--dark) 1px,transparent 1px);
  background-size:32px 32px,32px 32px;background-position:0 0,16px 16px}
button{font-family:inherit}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.en{direction:ltr;unicode-bidi:isolate;font-family:"Courier New",ui-monospace,monospace;font-style:normal;color:var(--cyan);font-weight:700;font-size:.92em}
#app{max-width:780px;margin:0 auto;padding:10px 12px 40px;min-height:100vh}

/* HUD */
#hud{display:flex;align-items:center;gap:10px;background:var(--dark);padding:8px 12px;margin:6px 4px 14px;position:sticky;top:4px;z-index:20;
  box-shadow:-4px 0 0 0 var(--silver),4px 0 0 0 var(--silver),0 -4px 0 0 var(--silver),0 4px 0 0 var(--silver),0 8px 0 0 rgba(0,0,0,.4)}
#hud.hide{display:none}
#hud .me{display:flex;flex-direction:column;flex:1;min-width:0}
#hud .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .rk{font-size:12px;color:var(--yellow)}
.bar{height:10px;background:var(--bg);margin-top:3px;position:relative;box-shadow:0 0 0 2px var(--slate)}
.bar>i{display:block;height:100%;background:var(--lime);transition:width .4s steps(8)}
#hud .cn{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--yellow)}
.ibtn{background:var(--navy);color:#fff;border:0;width:38px;height:38px;font-size:18px;cursor:pointer;
  box-shadow:-3px 0 0 0 var(--bg),3px 0 0 0 var(--bg),0 -3px 0 0 var(--bg),0 3px 0 0 var(--bg)}
.ibtn:active{transform:translateY(2px)}

/* panels & buttons */
.panel{position:relative;background:var(--dark);padding:14px 16px;margin:10px 4px;
  box-shadow:-4px 0 0 0 var(--silver),4px 0 0 0 var(--silver),0 -4px 0 0 var(--silver),0 4px 0 0 var(--silver),0 8px 0 0 rgba(0,0,0,.4)}
.panel.dark{background:var(--bg);box-shadow:-4px 0 0 0 var(--slate),4px 0 0 0 var(--slate),0 -4px 0 0 var(--slate),0 4px 0 0 var(--slate)}
.btn{font-weight:700;font-size:16px;background:var(--blue);color:#fff;border:0;padding:10px 18px;margin:8px 6px;cursor:pointer;min-height:44px;
  box-shadow:-4px 0 0 0 var(--bg),4px 0 0 0 var(--bg),0 -4px 0 0 var(--bg),0 4px 0 0 var(--bg),inset 0 -6px 0 0 rgba(0,0,0,.3),inset 0 4px 0 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(3px)}
.btn.ok{background:var(--green)} .btn.warn{background:var(--orange);color:var(--bg)} .btn.ghost{background:var(--slate)}
.btn.gold{background:var(--yellow);color:var(--bg)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px}
h1,h2,h3{margin:.2em 0;line-height:1.4}
h2{font-size:21px;color:var(--yellow)} h3{font-size:17px;color:var(--cyan)}
.muted{color:var(--silver);font-size:14px}
.center{text-align:center}

/* title */
.title{text-align:center;padding-top:10px}
.logo{font-size:34px;font-weight:900;color:var(--yellow);line-height:1.2;
  text-shadow:3px 3px 0 var(--red),6px 6px 0 var(--purple)}
.logo small{display:block;font-size:15px;color:var(--cyan);text-shadow:none;margin-top:10px;letter-spacing:1px}
.heroes{display:flex;justify-content:center;gap:12px;margin:12px 0}
.heroes button{background:var(--navy);border:0;padding:8px;cursor:pointer;
  box-shadow:-3px 0 0 0 var(--bg),3px 0 0 0 var(--bg),0 -3px 0 0 var(--bg),0 3px 0 0 var(--bg)}
.heroes button.sel{background:var(--yellow);animation:bob .6s steps(2) infinite}
input[type=text]{font:inherit;font-size:18px;text-align:center;width:min(300px,90%);padding:10px;color:var(--white);background:var(--bg);border:0;
  box-shadow:-3px 0 0 0 var(--silver),3px 0 0 0 var(--silver),0 -3px 0 0 var(--silver),0 3px 0 0 var(--silver)}

/* map */
.map-wrap{position:relative;margin:6px 6px 0;box-shadow:-4px 0 0 0 var(--silver),4px 0 0 0 var(--silver),0 -4px 0 0 var(--silver),0 4px 0 0 var(--silver),0 8px 0 0 rgba(0,0,0,.4)}
.map-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:8/5}
.node{position:absolute;transform:translate(-50%,-50%);width:15%;height:24%;background:transparent;border:0;cursor:pointer;padding:0}
.node .nm{display:none}
.node .lb{position:absolute;left:50%;top:92%;transform:translateX(-50%);white-space:nowrap;background:var(--bg);color:var(--white);
  font-size:clamp(9px,2.2vw,12px);padding:1px 6px;line-height:1.5;box-shadow:0 0 0 2px var(--silver)}
.node.cur .lb{background:var(--yellow);color:var(--bg);box-shadow:0 0 0 2px var(--orange)}
.node.locked .lb{background:var(--slate);color:var(--silver)}
.node .st{display:block;color:var(--yellow);font-size:clamp(8px,2vw,11px);letter-spacing:1px;line-height:1.1}
.node.shake{animation:shake .35s}
.lvl-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 6px 4px}
.lvl{font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--white);background:var(--navy);border:0;padding:6px 4px;cursor:pointer;min-height:48px;
  box-shadow:-3px 0 0 0 var(--bg),3px 0 0 0 var(--bg),0 -3px 0 0 var(--bg),0 3px 0 0 var(--bg),inset 0 -4px 0 0 rgba(0,0,0,.3)}
.lvl span{color:var(--yellow);font-size:13px;letter-spacing:1px}.lvl.locked{background:var(--slate);color:var(--silver)}
@media(min-width:640px){.node .nm{display:inline}.lvl-list{grid-template-columns:repeat(4,1fr)}}
.sheet{animation:pop .25s steps(4)}

/* stage */
.crumbs{display:flex;align-items:center;gap:6px;margin:4px;flex-wrap:wrap}
.pill{padding:2px 10px;font-size:13px;background:var(--bg);color:var(--silver);box-shadow:0 0 0 2px var(--slate)}
.pill.on{background:var(--yellow);color:var(--bg);box-shadow:0 0 0 2px var(--orange);font-weight:700}
.pill.done{background:var(--green);color:var(--bg);box-shadow:0 0 0 2px var(--teal)}
.npc{display:flex;gap:12px;align-items:flex-start}
.npc>img{flex:none;margin-top:6px;animation:bob .8s steps(2) infinite}
.bubble{flex:1;min-width:0}
.lesson-h{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;color:var(--yellow);margin-bottom:6px}
.lesson-h .ic{font-size:26px}
.lesson-b{font-size:16.5px}
.tip{background:var(--bg);border-right:5px solid var(--yellow);padding:8px 12px;margin:12px 0 4px;color:var(--yellow);font-weight:700}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.term{background:var(--navy);padding:3px 8px;font-size:13px;box-shadow:0 0 0 2px var(--blue)}
.term b{color:var(--cyan);direction:ltr;unicode-bidi:isolate;font-family:"Courier New",monospace}
.formula{direction:ltr;text-align:left;unicode-bidi:isolate;white-space:pre-wrap;background:var(--bg);color:var(--lime);font-family:"Courier New",ui-monospace,monospace;
  padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.6;box-shadow:inset 0 0 0 2px var(--slate);overflow-x:auto}
.formula b{color:var(--yellow)}
.tl{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:2px dotted var(--slate)}
.tl>span{flex:none;min-width:58px;text-align:center;background:var(--blue);color:#fff;font-family:"Courier New",monospace;font-weight:700;font-size:13px;padding:0 4px}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:10px;height:10px;background:var(--slate);display:block}
.dots i.on{background:var(--yellow)} .dots i.done{background:var(--green)}

/* games & quiz */
.hearts{display:flex;gap:4px;align-items:center}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:right;font:inherit;font-size:16.5px;color:var(--white);background:var(--navy);border:0;padding:10px 12px;margin:8px 0;cursor:pointer;min-height:48px;
  box-shadow:-4px 0 0 0 var(--bg),4px 0 0 0 var(--bg),0 -4px 0 0 var(--bg),0 4px 0 0 var(--bg),inset 0 -5px 0 0 rgba(0,0,0,.3)}
.opt .k{flex:none;width:28px;height:28px;background:var(--yellow);color:var(--bg);font-weight:900;display:grid;place-items:center;font-family:"Courier New",monospace}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--green);color:var(--bg);animation:pop .3s steps(3)} .opt.wrong{background:var(--red);animation:shake .35s}
.opt.gone{opacity:.25;pointer-events:none}
.opt[disabled]{pointer-events:none}
.fb{padding:10px 12px;margin-top:10px;background:var(--bg);box-shadow:inset 0 0 0 3px var(--slate)}
.fb.good{box-shadow:inset 0 0 0 3px var(--green)} .fb.bad{box-shadow:inset 0 0 0 3px var(--orange)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:block;width:100%;font:inherit;font-size:15px;text-align:center;color:var(--white);background:var(--navy);border:0;padding:10px 8px;margin:6px 0;cursor:pointer;min-height:46px;
  box-shadow:-3px 0 0 0 var(--bg),3px 0 0 0 var(--bg),0 -3px 0 0 var(--bg),0 3px 0 0 var(--bg),inset 0 -4px 0 0 rgba(0,0,0,.3)}
.chip.sel{background:var(--yellow);color:var(--bg)} .chip.hit{background:var(--green);color:var(--bg);pointer-events:none}
.chip.bad{animation:shake .35s;background:var(--red)}
.item-card{font-size:19px;font-weight:700;text-align:center;padding:18px 10px;background:var(--bg);margin:8px 0 14px;box-shadow:inset 0 0 0 3px var(--yellow)}
.bk{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.chain{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.chain div{background:var(--green);color:var(--bg);padding:6px 10px;font-weight:700;animation:pop .25s steps(3)}
.missions{list-style:none;margin:10px 0 0;padding:0}
.missions li{padding:6px 10px;margin:6px 0;background:var(--bg);box-shadow:inset 0 0 0 2px var(--slate);font-size:14.5px}
.missions li.ok{box-shadow:inset 0 0 0 2px var(--green);color:var(--lime)}
.missions li:before{content:"⬜ "} .missions li.ok:before{content:"✅ "}
.ctrl{margin:8px 0}.ctrl label{display:flex;justify-content:space-between;font-size:14px;color:var(--silver)}
.ctrl label b{color:var(--yellow);font-family:"Courier New",monospace}
input[type=range]{width:100%;accent-color:var(--yellow);height:28px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.readout div{background:var(--bg);padding:6px 8px;text-align:center;box-shadow:inset 0 0 0 2px var(--slate);font-size:13px;color:var(--silver)}
.readout b{display:block;font-size:18px;color:var(--lime);font-family:"Courier New",monospace;direction:ltr}
.readout b.neg{color:var(--orange)} .readout b.y{color:var(--yellow)}
canvas.chart{width:100%;height:auto;background:var(--bg);display:block;box-shadow:inset 0 0 0 3px var(--slate)}
table.grid{width:100%;direction:ltr;table-layout:fixed;border-collapse:separate;border-spacing:3px;text-align:center;font-size:13px}
table.grid th{unicode-bidi:plaintext}
table.grid th{background:var(--navy);padding:4px;font-weight:700;font-size:12.5px}
table.grid td{background:var(--bg);padding:2px;position:relative;vertical-align:middle;box-shadow:inset 0 0 0 2px var(--slate)}
table.grid td .c{position:absolute;top:1px;left:3px;font-size:11px;color:var(--orange);font-family:"Courier New",monospace}
table.grid td .q{font-size:18px;font-weight:900;color:var(--yellow);font-family:"Courier New",monospace;display:block;margin:6px 0 2px}
table.grid td .pm{display:flex;gap:2px;justify-content:center}
table.grid td .pm button{width:24px;height:26px;border:0;background:var(--blue);color:#fff;font-weight:900;cursor:pointer;font-size:16px;padding:0}
table.grid td.pick{background:var(--green);color:var(--bg);cursor:pointer}
table.grid td.pick .cc{color:var(--bg)}
table.grid td.can{cursor:pointer}
table.grid td.zero{color:var(--lime)}
.okc{color:var(--lime)} .badc{color:var(--orange)}
.mat{display:inline-block;margin:6px}.mat table{border-collapse:collapse;font-family:"Courier New",monospace;direction:ltr}
.mat td,.mat th{border:2px solid var(--slate);padding:2px 7px;font-size:13px;text-align:center}
.mat td.z{background:var(--green);color:var(--bg);font-weight:900}
.cert{text-align:center;padding:26px 14px;background:var(--yellow);color:var(--bg);
  box-shadow:-6px 0 0 0 var(--orange),6px 0 0 0 var(--orange),0 -6px 0 0 var(--orange),0 6px 0 0 var(--orange),0 12px 0 0 rgba(0,0,0,.4)}
.cert h1{font-size:30px;color:var(--purple)} .cert .nm{font-size:28px;font-weight:900;color:var(--red);margin:8px 0;text-shadow:2px 2px 0 var(--white)}
.stars{font-size:34px;letter-spacing:6px;color:var(--yellow);text-shadow:3px 3px 0 var(--orange)}
.gl-item{padding:6px 0;border-bottom:2px dotted var(--slate)} .gl-item .e{display:block}
.gl-item .a{color:var(--yellow);font-weight:700}
.search{margin:6px 0 10px;width:100%!important}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--yellow);color:var(--bg);font-weight:700;padding:8px 16px;z-index:100;
  box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--orange);animation:float 1.9s steps(12) forwards;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90;image-rendering:pixelated}
.overlay{position:fixed;inset:0;background:rgba(26,28,44,.92);z-index:60;overflow:auto;padding:14px}
.overlay .box{max-width:720px;margin:0 auto}

@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes float{0%{opacity:0;transform:translate(-50%,10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
@media(max-width:480px){.logo{font-size:28px}.lesson-b{font-size:16px}.cols{gap:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div id="app"><div id="hud" class="hide"></div><main id="screen"></main></div>
<script>
(function(){'use strict';
/* ============================================================
   محتوى اللعبة — كل مرحلة = فصل/جزء من المادة.
   لإضافة مرحلة جديدة: أضف كائن جديد إلى LEVELS (نفس الشكل) فقط.
   ============================================================ */
const E = t => `<i class="en">${t}</i>`;

const LEVELS = [
/* ───────────────────────── المرحلة 1 ───────────────────────── */
{
  id: 1, ch: 'الفصل الأول', name: 'بوابة المصنع', short: 'مفاهيم الهندسة الصناعية',
  intro: 'هلا بيك يا مغامر! وصلت لجزيرة الرقاقة 🏝️ بيها مصنع يسوّي أجهزة اتصالات ودوائر PCB. أني بِت، الروبوت الدليل. أول شي لازم نعرف: الهندسة الصناعية شنو ومن وين جات؟',
  lessons: [
    { ic: '💡', t: 'الهندسة الصناعية شنو؟',
      b: `تخيّل عندك ورشة صغيرة تسوّي ألعاب. الهندسة الصناعية هي الشخص الشاطر اللي يخلي الورشة تسوّي <b>ألعاب أكثر، بجودة أحسن، وبخسارة أقل</b>، بدون ما يضيّع مواد ولا وقت ولا تعب عمال.<br><br>
          <b>التعريف الرسمي:</b> العلوم اللي تنسّق بين ثلاث أشياء: <b>خصائص المواد الخام + طاقة المكائن + جهد العمال</b>، حتى نقلل هدر الموارد ونحسّن إنتاجية العمل.`,
      tip: 'الثلاثي الذهبي: مواد 🧱 + مكائن ⚙️ + عمال 👷',
      terms: [['Industrial Enterprise', 'منشأة / مشروع صناعي'], ['Resource Waste', 'هدر الموارد']] },
    { ic: '🚀', t: 'ليش احتاجوها؟',
      b: `المكائن صارت <b>أسرع وأدق وأوتوماتيكية</b> (${E('Automation')}). بس مكينة سريعة بدون عمال ماهرين وإدارة شاطرة = سيارة سباق بدون سائق!<br><br>
          فلازم تتطور معاها: <b>طرق التصنيع + مهارات العمال + أنظمة الإدارة</b>، حتى نستغل كل طاقة المكينة، نزيد الإنتاج، نحسّن الجودة ونقلل الكلفة.<br>
          والهندسة الصناعية تستخدم <b>أساليب كمية (أرقام)</b> حتى ما نضيّع طاقة ولا مواد ولا عمالة.`,
      terms: [['Automation Level', 'مستوى الأتمتة (الآلية)'], ['Manufacturing Costs', 'تكاليف التصنيع']] },
    { ic: '🏚️', t: 'القصة — المرحلة 1: قبل الثورة الصناعية',
      b: `الإنتاج <b>يدوي</b> بورش صغيرة وبيوت.<br>
          • ما كانت كو منافسة، لأن الإنتاج قليل والطلب قليل (مستوى المعيشة واطئ).<br>
          • صاحب المصنع يدير ويسعّر <b>بالتجربة والخطأ</b> بدون نظام علمي.`,
      tip: 'قبل الثورة = يدوي + بدون منافسة + تجربة وخطأ',
      terms: [['Trial-and-Error Approach', 'أسلوب التجربة والخطأ'], ['Living Standards', 'مستويات المعيشة']] },
    { ic: '🏭', t: 'المرحلة 2: الثورة الصناعية (1775)',
      b: `بدأت بمحرك <b>جيمس واط البخاري سنة 1775</b>. المكائن نقلت الشغل من البيوت للمصانع، وظهرت مشاكل، وكل مشكلة ولّدت حل:<br><br>
          ⚙️ المكينة تنتج أكثر بدون جهد زايد من العامل ← <b>خلافات أجور</b> ← ظهرت <b>دراسة العمل</b> (${E('Work Study')}) لتحديد وقت قياسي وحوافز.<br>
          🚑 حوادث أكثر ← <b>تدريب مهني + قواعد سلامة + تعويضات</b>.<br>
          🏗️ مصانع أكبر ← <b>دراسات جدوى + هيكل تنظيمي + تخطيط ورقابة</b>.<br>
          🥊 منافسة شديدة ← <b>محاسبة كلفة، قياس إنتاجية، رقابة خزين، مناولة مواد، ضبط جودة</b>.`,
      terms: [['Work Study', 'دراسة العمل (الحركة والزمن)'], ['Industrial Safety', 'الأمان الصناعي'], ['Cost Accounting', 'محاسبة التكاليف']] },
    { ic: '👨‍🔬', t: 'العلماء — الجزء 1 (1776 → 1916)',
      b: `<div class="tl"><span>1776</span><b>آدم سميث</b> — <i class="en">Division of Labor</i> تقسيم العمل</div>
          <div class="tl"><span>1832</span><b>باباج</b> — <i class="en">Skill Specialization</i> ربط الأجر بمستوى المهارة</div>
          <div class="tl"><span>1886</span><b>هنري تاون</b> — تحليل البيانات الإحصائية (بداية الإدارة العلمية)</div>

      c.strokeStyle = '#ef7d57'; c.beginPath(); c.moveTo(X(0), Y(FC)); c.lineTo(X(100), Y(FC + VC)); c.stroke();
      c.fillStyle = '#a7f070'; c.fillText('Revenue', 230, 22); c.fillStyle = '#ef7d57'; c.fillText('Total Cost', 230, 34); c.fillStyle = '#94b0c2'; c.fillText('Fixed Cost', 230, 46);
      if (isFinite(bp) && bp <= 100) { c.fillStyle = '#ffcd75'; const bx = X(bp), by = Y(FC + VC * bp / 100); c.fillRect(bx - 4, by - 4, 8, 8); c.fillStyle = '#1a1c2c'; c.fillRect(bx - 2, by - 2, 4, 4); c.fillStyle = '#ffcd75'; c.fillText('BEP', bx - 8, by - 8); }
      c.strokeStyle = '#41a6f6'; c.lineWidth = 1; c.beginPath(); c.moveTo(X(cap), 10); c.lineTo(X(cap), 168); c.stroke();
      c.fillStyle = '#a7f070'; c.fillRect(X(cap) - 2, Y(sales) - 2, 5, 5); c.fillStyle = '#ef7d57'; c.fillRect(X(cap) - 2, Y(tc) - 2, 5, 5);
      ro.s.textContent = fmt(sales); ro.c.textContent = fmt(tc); ro.p.textContent = fmt(profit); ro.p.className = profit < 0 ? 'neg' : '';
      ro.bv.textContent = isFinite(bv) ? fmt(bv) : '∞'; ro.bp.textContent = isFinite(bp) ? bp.toFixed(0) + '%' : '∞'; ro.ms.textContent = sales > 0 && isFinite(bv) ? ms.toFixed(0) + '%' : '—';
      if (cap > 0 && Math.abs(profit) <= 100) mk.set(0);
      if (profit >= 3000 && cap <= 90) mk.set(1);
      if (isFinite(bp) && bp < 25) mk.set(2);

    const s2 = slider('الكلف الثابتة (Fixed Costs) — دينار', 500, 4000, 50, FC, v => { FC = v; draw(); });
    const s3 = slider('الكلف المتغيرة عند 100% طاقة — دينار', 2000, 8000, 100, VC, v => { VC = v; draw(); });
    box.append(h('p', { class: 'muted' }, 'مصنع PCB: مبيعات 100% طاقة = 10,000 دينار. حرّك المنزلقات وشوف الخطوط. (مثال الكتاب: ثابتة 1500، متغيرة 5000 ← تعادل عند 30%)'), cv, readout, s1.el, s2.el, s3.el, h('h3', {}, '🎯 المهمات'), mk.el);
    draw();
  },

  /* ── حاسبة الوقت القياسي ── */
  stdtime(box, done) {
    const obs = [42, 40, 44, 41, 43], avg = obs.reduce((a, b) => a + b) / obs.length; let rate = 100, al = 0, fired = false;
    const mk = missions(['⏱️ اضبط التقييم 100% (عامل اعتيادي) والسماحيات 15% ← الوقت القياسي ≈ 48.3 ثانية', '🐇 خلّي العامل أسرع من الاعتيادي (تقييم 120%) وشوف: الوقت الاعتيادي صار أكبر من الملاحظ']);
    const out = h('div'), warn = h('div', { class: 'fb bad', style: 'display:none' }, '⚠️ السماحيات عادةً لا تتجاوز 15%!');
    function draw() {
      const normal = avg * rate / 100, std = normal * (1 + al / 100);
      out.replaceChildren(h('div', { class: 'readout' },
        h('div', {}, 'المُلاحَظ (المعدل)', h('b', {}, avg.toFixed(1) + ' s')), h('div', {}, 'الاعتيادي', h('b', { class: 'y' }, normal.toFixed(1) + ' s')), h('div', {}, 'القياسي', h('b', {}, std.toFixed(1) + ' s'))),
        h('div', { class: 'formula' }, 'Normal = Observed × Rating = ' + avg.toFixed(1) + ' × ' + (rate / 100).toFixed(2) + ' = ' + normal.toFixed(1) + '\nStandard = Normal × (1 + Allowance) = ' + normal.toFixed(1) + ' × ' + (1 + al / 100).toFixed(2) + ' = ' + std.toFixed(1)));

    const s2 = slider('السماحيات (Allowances)', 0, 25, 1, al, v => { al = v; draw(); }, '%');
    box.append(h('p', { class: 'muted' }, 'راقبنا عامل يلحم قطعة PCB 5 مرات: ' + obs.join('s ، ') + 's'), out, s1.el, s2.el, warn, h('h3', {}, '🎯 المهمات'), mk.el);

  },

  /* ── محاكي دورة الإنتاج ── */
  cycle(box, done) {
    let n = 4, t = [2, 2, 2], method = 'seq', k = 2, fired = false; const tried = new Set();
    const mk = missions(['➡️ جرّب الحركة التتابعية (Sequential)', '⚡ جرّب الحركة المتوازية (Parallel) وقارن الزمن', '🧩 جرّب المختلطة (Combined) بدفعات فرعية']);
    const [cv, c] = cvs(320, 130); const info = h('div'), kc = h('div');
    const COL = ['#ef7d57', '#ffcd75', '#a7f070', '#73eff7', '#41a6f6', '#b13e53', '#38b764', '#f4f4f4'];
    function sched(method) {
      const sizes = []; if (method === 'seq') sizes.push(n); else if (method === 'par') for (let i = 0; i < n; i++) sizes.push(1); else for (let r = n; r > 0; r -= k) sizes.push(Math.min(k, r));
      const end = sizes.map(() => [0, 0, 0]), bars = []; let pieceBase = 0;
      sizes.forEach((sz, u) => { for (let s = 0; s < 3; s++) { const st = Math.max(s ? end[u][s - 1] : 0, u ? end[u - 1][s] : 0), d = sz * t[s]; end[u][s] = st + d;
        for (let j = 0; j < sz; j++) bars.push({ s, p: pieceBase + j, a: st + j * t[s], b: st + (j + 1) * t[s] }); } pieceBase += sz; });
      return { bars, total: end[sizes.length - 1][2] };
    }
    function draw() {
      const R = sched(method), W = 296, sc = W / Math.max(R.total, 1);
      c.fillStyle = '#1a1c2c'; c.fillRect(0, 0, 320, 130); c.font = '9px monospace'; c.fillStyle = '#94b0c2';
      ['Stage 1', 'Stage 2', 'Stage 3'].forEach((l, i) => c.fillText(l, 2, 28 + i * 30));
      R.bars.forEach(b => { c.fillStyle = COL[b.p % 8]; c.fillRect(48 + b.a * sc * .85, 14 + b.s * 30, Math.max(1, (b.b - b.a) * sc * .85 - 1), 20); });
      c.fillStyle = '#ffcd75'; c.fillText('0', 48, 124); c.fillText(R.total + ' min', 48 + R.total * sc * .85 - 24, 124);
      const S1 = sched('seq').total, S2 = sched('par').total, S3 = sched('mix').total;
      info.replaceChildren(h('div', { class: 'readout' }, h('div', {}, 'تتابعية', h('b', {}, S1 + ' min')), h('div', {}, 'متوازية', h('b', { class: S2 < S1 ? '' : 'neg' }, S2 + ' min')), h('div', {}, 'مختلطة (دفعة ' + k + ')', h('b', { class: 'y' }, S3 + ' min'))),
        h('div', { class: 'formula' }, 'Sequential = n × Σt = ' + n + ' × ' + (t[0] + t[1] + t[2]) + ' = ' + S1 + '\nParallel = Σt + (n−1) × max(t) = ' + (t[0] + t[1] + t[2]) + ' + ' + (n - 1) + ' × ' + Math.max(...t) + ' = ' + S2));
      if (tried.has('seq')) mk.set(0); if (tried.has('par')) mk.set(1); if (tried.has('mix')) mk.set(2);
      if (tried.size === 3 && !fired) { fired = true; done(); }
    }
    const tabs = [['seq', '➡️ تتابعية'], ['par', '⚡ متوازية'], ['mix', '🧩 مختلطة']].map(([m, l]) => h('button', { class: 'btn sm' + (m === method ? '' : ' ghost'), onclick: () => { method = m; tried.add(m); SFX.click(); tabs.forEach((b, i) => b.className = 'btn sm' + (['seq', 'par', 'mix'][i] === m ? '' : ' ghost')); kc.style.display = m === 'mix' ? 'block' : 'none'; draw(); } }, l));
    const sn = slider('عدد القطع (n)', 2, 8, 1, n, v => { n = v; draw(); });
    const st = [0, 1, 2].map(i => slider('زمن المرحلة ' + (i + 1) + ' (دقيقة)', 1, 5, 1, t[i], v => { t[i] = v; draw(); }));
    const sk = slider('حجم الدفعة الفرعية', 1, 4, 1, k, v => { k = v; draw(); }); kc.append(sk.el); kc.style.display = 'none';
    box.append(h('p', { class: 'muted' }, 'كل لون = قطعة. شوف كيف يتغير الزمن الكلي حسب طريقة نقل المواد بين المراحل.'), h('div', { class: 'row' }, tabs), cv, info, sn.el, ...st.map(x => x.el), kc, h('h3', {}, '🎯 المهمات'), mk.el);
    draw();
  },

  /* ── محاكي النقل ── */
  transport(box, done) {
    const cost = [[9, 3, 2], [4, 6, 2], [9, 2, 1]], sup = [30, 40, 30], dem = [20, 50, 30], OPT = 260;
    const rn = ['بغداد', 'البصرة', 'أربيل'], cn = ['مخزن 1', 'مخزن 2', 'مخزن 3'];
    let al = cost.map(r => r.map(() => 0)), fired = false;
    const mk = missions(['✅ اعمل خطة صحيحة: كل مصنع يشحن كل إنتاجه وكل مخزن ياخذ طلبه بالضبط', '🏆 اوصل لأقل كلفة ممكنة (الحل الأمثل)']);
    const tbl = h('div'), info = h('div'), hintEl = h('div');
    const rs = i => al[i].reduce((a, b) => a + b, 0), cs = j => al.reduce((a, r) => a + r[j], 0);
    const total = () => al.reduce((a, r, i) => a + r.reduce((x, q, j) => x + q * cost[i][j], 0), 0);
    function nw() { const s = sup.slice(), d = dem.slice(); let i = 0, j = 0; al = cost.map(r => r.map(() => 0)); while (i < 3 && j < 3) { const q = Math.min(s[i], d[j]); al[i][j] = q; s[i] -= q; d[j] -= q; if (s[i] === 0) i++; else j++; } }
    function lc() { const s = sup.slice(), d = dem.slice(); al = cost.map(r => r.map(() => 0)); const cells = []; cost.forEach((r, i) => r.forEach((v, j) => cells.push([v, i, j]))); cells.sort((a, b) => a[0] - b[0]); cells.forEach(([v, i, j]) => { const q = Math.min(s[i], d[j]); if (q > 0) { al[i][j] = q; s[i] -= q; d[j] -= q; } }); }
    function draw(msg) {
      const feas = sup.every((v, i) => rs(i) === v) && dem.every((v, j) => cs(j) === v), tc = total();
      const t = h('table', { class: 'grid' }, h('tr', {}, h('th', {}), ...cn.map((n, j) => h('th', {}, n, h('br'), h('span', { class: cs(j) === dem[j] ? 'okc' : (cs(j) > dem[j] ? 'badc' : '') }, cs(j) + ' / ' + dem[j]))), h('th', {}, 'العرض')),
        ...rn.map((n, i) => h('tr', {}, h('th', {}, n), ...cost[i].map((cv, j) => h('td', {}, h('span', { class: 'c' }, '💲' + cv), h('span', { class: 'q' }, al[i][j]),
          h('div', { class: 'pm' }, h('button', { onclick: () => { if (al[i][j] > 0) { al[i][j] -= 10; SFX.click(); draw(); } } }, '−'), h('button', { onclick: () => { al[i][j] += 10; SFX.click(); draw(); } }, '+')))),
          h('th', {}, h('span', { class: rs(i) === sup[i] ? 'okc' : (rs(i) > sup[i] ? 'badc' : '') }, rs(i) + ' / ' + sup[i])))));
      tbl.replaceChildren(t);
      info.replaceChildren(h('div', { class: 'readout' }, h('div', {}, 'الكلفة الكلية T.T.C.', h('b', { class: feas ? 'y' : 'neg' }, fmt(tc))), h('div', {}, 'الحالة', h('b', { class: feas ? '' : 'neg' }, feas ? 'خطة صحيحة ✔' : 'غير مكتملة'))), msg ? h('div', { class: 'fb' }, msg) : '');
      let all = false;
      if (feas) all = mk.set(0);
      if (feas && tc === OPT) { mk.set(1); if (!fired) { fired = true; done(); } }
      else if (feas && tc > OPT) info.append(h('div', { class: 'fb bad' }, 'الخطة ممكنة بس مو الأرخص! الكلفة ' + fmt(tc) + ' ويمكن تقل. جرّب تنقل الكميات للطرق الأرخص.'));
    }
    const auto = (name, fn) => h('button', { class: 'btn sm ghost', onclick: () => { fn(); SFX.click(); draw('طريقة ' + name + ' أعطت كلفة ' + fmt(total()) + (total() === OPT ? ' — وهي الأمثل!' : ' — لكن الأمثل ' + fmt(OPT) + '، يعني تحتاج تحسين (Stepping-Stone).')); } }, name);
    box.append(h('p', { class: 'muted' }, 'المصانع: بغداد، البصرة، أربيل (صفوف) والمخازن أعمدة. كل ضغطة + أو − = 10 وحدات. الرقم البرتقالي 💲 = كلفة نقل الوحدة. لازم مجموع الصف = العرض ومجموع العمود = الطلب.'),
      tbl, info, h('div', { class: 'row' }, auto('Northwest Corner', nw), auto('Least Cost', lc), h('button', { class: 'btn sm warn', onclick: () => { al = cost.map(r => r.map(() => 0)); draw(); } }, '🔄 صفّر')),
      h('div', { class: 'row' }, h('button', { class: 'btn sm gold', onclick: () => { hintEl.replaceChildren(h('div', { class: 'fb' }, '💡 تلميح: بغداد ← مخزن 2 (20) + مخزن 3 (10) • البصرة ← مخزن 1 (20) + مخزن 3 (20) • أربيل ← مخزن 2 (30)')); } }, '💡 تلميح الحل الأمثل')), hintEl,
      h('h3', {}, '🎯 المهمات'), mk.el);
    draw();
  },

  /* ── محاكي التخصيص ── */
  assign(box, done) {
    const M = [[10, 11, 4, 2, 8], [7, 11, 10, 14, 12], [5, 6, 9, 12, 14], [13, 15, 11, 10, 7]], OPT = 22; const pick = [-1, -1, -1, -1]; let fired = false;
    const jobs = ['J1 لحام', 'J2 فحص', 'J3 تجميع', 'J4 تغليف'];
    const mk = missions(['✅ خصّص كل مهمة لمكينة مختلفة (4 مهام، مكينة وحدة تبقى فاضية)', '🏆 اوصل لأقل كلفة كلية = 22']);
    const tbl = h('div'), info = h('div'), steps = h('div');
    function draw() {
      const used = pick.filter(x => x >= 0), full = used.length === 4, tc = pick.reduce((a, m, i) => a + (m >= 0 ? M[i][m] : 0), 0);
      tbl.replaceChildren(h('table', { class: 'grid' }, h('tr', {}, h('th', {}), ...[1, 2, 3, 4, 5].map(m => h('th', {}, 'M' + m))),
        ...M.map((r, i) => h('tr', {}, h('th', {}, jobs[i]), ...r.map((v, m) => h('td', { class: 'can' + (pick[i] === m ? ' pick' : ''), onclick: () => {
          if (pick[i] === m) pick[i] = -1; else { const o = pick.indexOf(m); if (o >= 0) { SFX.bad(); toast('المكينة M' + (m + 1) + ' محجوزة للمهمة J' + (o + 1)); return; } pick[i] = m; }
          SFX.click(); draw(); } }, h('span', { class: 'q' }, v)))))));
      info.replaceChildren(h('div', { class: 'readout' }, h('div', {}, 'الكلفة الحالية', h('b', { class: 'y' }, tc)), h('div', {}, 'الهدف (الأمثل)', h('b', {}, '؟')), h('div', {}, 'مكينة فاضية', h('b', {}, full ? 'M' + [0, 1, 2, 3, 4].filter(m => !used.includes(m)).map(m => m + 1).join('') : '—'))));
      if (full) { mk.set(0); if (tc === OPT) { mk.set(1); if (!fired) { fired = true; done(); } } else info.append(h('div', { class: 'fb bad' }, 'الكلفة ' + tc + ' — فيه حل أرخص! جرّب تبدّل.')); }
    }
    const mats = [
      ['بعد إضافة المهمة الوهمية J5 (كلفتها صفر)', [[10, 11, 4, 2, 8], [7, 11, 10, 14, 12], [5, 6, 9, 12, 14], [13, 15, 11, 10, 7], [0, 0, 0, 0, 0]]],
      ['بعد طرح أصغر قيمة بكل صف (الأعمدة ما تتغير)', [[8, 9, 2, 0, 6], [0, 4, 3, 7, 5], [0, 1, 4, 7, 9], [6, 8, 4, 3, 0], [0, 0, 0, 0, 0]]],
      ['خطوط التغطية 4 < 5 ← نطرح 1 من غير المغطى ونضيفه للتقاطعات', [[8, 8, 1, 0, 6], [0, 3, 2, 7, 5], [0, 0, 3, 7, 9], [6, 7, 3, 3, 0], [1, 0, 0, 1, 1]]]
    ];
    const tog = h('button', { class: 'btn sm ghost', onclick: () => { if (steps.childNodes.length) { steps.replaceChildren(); return; } SFX.click();
      steps.replaceChildren(h('div', { class: 'panel dark' }, ...mats.map(([t, m]) => h('div', { class: 'mat' }, h('div', { class: 'muted' }, t), h('table', {}, ...m.map((r, i) => h('tr', {}, h('th', {}, i < 4 ? 'J' + (i + 1) : 'J5'), ...r.map(v => h('td', { class: v === 0 ? 'z' : '' }, v))))))),
        h('p', { class: 'okc' }, 'عدد خطوط التغطية صار 5 = n ← الحل أمثل:'), h('div', { class: 'formula' }, 'J1→M4 = 2\nJ2→M1 = 7\nJ3→M2 = 6\nJ4→M5 = 7\nTotal = 22'), h('p', { class: 'okc' }, 'والمكينة M3 تروح للمهمة الوهمية (بدون شغل).'))); } }, '📘 شوف خطوات الطريقة المجرية');
    box.append(h('p', { class: 'muted' }, 'مثال 2 من الكتاب: 4 مهام و5 مكائن (جدول الكلفة). اضغط على خلية لتعطي المهمة لمكينة. كل مكينة لمهمة وحدة فقط.'), tbl, info, h('div', { class: 'row' }, tog), steps, h('h3', {}, '🎯 المهمات'), mk.el);
    draw();
  }
};


load(); window.__G={S:()=>S,LEVELS,ALL,viewMap,viewLesson,viewTrain,viewQuiz,viewTitle,SIMS,GAMES};
